<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
  <title>Three tasks, each with its own TCB and its own stack; the tasks that are not running have their registers saved on their stacks</title>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <g fill="#7b8494" text-anchor="middle" font-weight="600">
    <text x="130" y="24">Sensor: Running</text>
    <text x="380" y="24">Logger: Ready</text>
    <text x="630" y="24">Display: Blocked</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="#6366f1" fill-opacity="0.12">
    <rect x="50" y="38" width="160" height="70" rx="6"/>
    <rect x="300" y="38" width="160" height="70" rx="6"/>
    <rect x="550" y="38" width="160" height="70" rx="6"/>
  </g>
  <g fill="#7b8494" text-anchor="middle">
    <text x="130" y="60">TCB</text><text x="130" y="80">priority 3</text><text x="130" y="98">registers: in the CPU</text>
    <text x="380" y="60">TCB</text><text x="380" y="80">priority 1</text><text x="380" y="98">saved stack pointer</text>
    <text x="630" y="60">TCB</text><text x="630" y="80">priority 2</text><text x="630" y="98">saved stack pointer</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <rect x="70" y="150" width="120" height="190"/>
    <rect x="320" y="150" width="120" height="190"/>
    <rect x="570" y="150" width="120" height="190"/>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5">
    <rect x="70" y="270" width="120" height="70" fill="#10b981" fill-opacity="0.2"/>
    <rect x="320" y="250" width="120" height="90" fill="#10b981" fill-opacity="0.2"/>
    <rect x="320" y="210" width="120" height="40" fill="#f59e0b" fill-opacity="0.25"/>
    <rect x="570" y="290" width="120" height="50" fill="#10b981" fill-opacity="0.2"/>
    <rect x="570" y="250" width="120" height="40" fill="#f59e0b" fill-opacity="0.25"/>
  </g>
  <g fill="#7b8494" text-anchor="middle">
    </g><g fill="#7b8494"><text x="80" y="172">free</text><text x="330" y="172">free</text><text x="580" y="172">free</text></g><g fill="#7b8494" text-anchor="middle">
    <text x="130" y="300">locals,</text><text x="130" y="318">return addresses</text>
    <text x="380" y="290">locals,</text><text x="380" y="308">return addresses</text>
    <text x="380" y="235">saved registers</text>
    <text x="630" y="320">locals</text>
    <text x="630" y="275">saved registers</text>
    <text x="130" y="362">its own stack</text><text x="380" y="362">its own stack</text><text x="630" y="362">its own stack</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M380 108V206" marker-end="url(#p)"/>
    <path d="M630 108V246" marker-end="url(#p)"/>
    <path d="M232 270H194" marker-end="url(#p)"/>
  </g>
  <text x="238" y="275" fill="#7b8494">CPU's SP</text>
</svg>
