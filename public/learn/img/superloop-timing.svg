<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
  <title>A main loop's response time: a button press that arrives just after the button check waits almost a whole loop</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g stroke="#9ca3af" stroke-width="1.5">
    <rect x="40" y="70" width="70" height="40" fill="#6366f1" fill-opacity="0.18"/>
    <rect x="110" y="70" width="110" height="40" fill="#6366f1" fill-opacity="0.18"/>
    <rect x="220" y="70" width="60" height="40" fill="#10b981" fill-opacity="0.25"/>
    <rect x="280" y="70" width="100" height="40" fill="#6366f1" fill-opacity="0.18"/>
    <rect x="380" y="70" width="70" height="40" fill="#6366f1" fill-opacity="0.18"/>
    <rect x="450" y="70" width="110" height="40" fill="#6366f1" fill-opacity="0.18"/>
    <rect x="560" y="70" width="60" height="40" fill="#10b981" fill-opacity="0.25"/>
    <rect x="620" y="70" width="100" height="40" fill="#6366f1" fill-opacity="0.18"/>
  </g>
  <g fill="#7b8494" text-anchor="middle">
    <text x="75" y="95">sensors</text>
    <text x="165" y="95">display</text>
    <text x="250" y="95">button</text>
    <text x="330" y="95">log</text>
    <text x="415" y="95">sensors</text>
    <text x="505" y="95">display</text>
    <text x="590" y="95">button</text>
    <text x="670" y="95">log</text>
    <text x="210" y="140">loop 1</text>
    <text x="550" y="140">loop 2</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <path d="M40 120v8M40 124h340M380 120v8M380 124h340M720 120v8"/>
  </g>
  <g stroke="#f59e0b" stroke-width="2" fill="none">
    <path d="M290 34V66" marker-end="url(#a)"/>
    <path d="M590 46V66" marker-end="url(#a)"/>
    <path d="M290 160v18M290 169h300M590 160v18"/>
  </g>
  <g fill="#f59e0b" font-weight="600">
    <text x="296" y="28">button pressed here…</text>
    <text x="596" y="40">…noticed here</text>
  </g>
  <text x="440" y="198" fill="#7b8494" text-anchor="middle">response time: up to one whole loop</text>
</svg>
